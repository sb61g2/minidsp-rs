name: "MiniDSP RS"
version: "0.1.12"
slug: "minidsp"
description: "MiniDSP control daemon providing HTTP API and TCP server for USB-connected MiniDSP DSP devices"
url: "https://github.com/mrene/minidsp-rs"
arch:
  - aarch64
  - armv7
  - armhf
  - amd64
startup: services
boot: auto
init: false

# USB device access for MiniDSP hardware
usb: true

# Expose HTTP API and TCP protocol server
ports:
  5380/tcp: 5380
  5333/tcp: 5333
ports_description:
  5380/tcp: "HTTP REST API"
  5333/tcp: "TCP Protocol Server (for MiniDSP mobile/desktop apps)"

# Persistent config storage
map:
  - config:rw

options:
  log_level: "info"
  http_bind_address: "0.0.0.0:5380"
  tcp_bind_address: "0.0.0.0:5333"
  advertise_name: ""
  advertise_ip: ""

schema:
  log_level: "list(trace|debug|info|warn|error)"
  http_bind_address: str
  tcp_bind_address: str
  advertise_name: str
  advertise_ip: str
