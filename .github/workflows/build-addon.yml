name: Build Home Assistant Add-on

on:
  push:
    branches: [dev]
    paths:
      - 'homeassistant/**'
      - 'protocol/src/**'
      - 'daemon/src/**'
      - 'minidsp/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            use_cross: true
          - arch: armv7
            target: armv7-unknown-linux-gnueabihf
            platform: linux/arm/v7
            use_cross: true
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          curl -fsSL -o /tmp/cross.tar.gz \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -xzf /tmp/cross.tar.gz -C /usr/local/bin cross

      - name: Install native build packages
        if: ${{ !matrix.use_cross }}
        run: sudo apt-get update && sudo apt-get install -y --fix-missing libusb-1.0-0-dev libhidapi-dev libudev-dev

      - name: Build minidspd
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --bin minidspd --target ${{ matrix.target }}
          else
            cargo build --release --bin minidspd --target ${{ matrix.target }}
          fi

      # Stage the pre-built binary into the add-on directory for Docker COPY
      - name: Stage binary
        run: |
          cp target/${{ matrix.target }}/release/minidspd homeassistant/minidspd
          chmod +x homeassistant/minidspd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: version
        run: |
          VERSION=$(grep '^version:' homeassistant/config.yaml \
            | sed 's/version: "\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: homeassistant/
          file: homeassistant/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minidsp-rs-addon-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/minidsp-rs-addon-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
